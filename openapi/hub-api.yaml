openapi: 3.1.0
info:
  title: Central Hub API
  version: 0.1.0
  description: >
    Read-only API behind the Central Hub web app. This file, not the code, is the
    source of truth for the shape of an answer. A replacement backend is acceptable
    when it passes the contract tests against its URL.
servers:
  - url: /
paths:
  /api/v1/catalog:
    get:
      operationId: getCatalog
      summary: Areas and rooms
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
  /api/v1/agents:
    get:
      operationId: getAgents
      summary: Agent sheets as the ten-section view
      responses:
        '200':
          description: The agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agents'
  /api/v1/notebook:
    get:
      operationId: getNotebook
      summary: Whether a notebook is connected, and how many notes it holds
      responses:
        '200':
          description: The notebook's state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookState'
  /api/v1/notebook/folder:
    get:
      operationId: getNotebookFolder
      summary: One folder of the notebook (the root when path is empty)
      parameters:
        - {name: path, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: The folder's sub-folders and notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookFolder'
        '400': {description: A path that is not allowed}
        '404': {description: No such folder}
        '503': {description: No notebook is connected}
  /api/v1/notebook/note:
    get:
      operationId: getNotebookNote
      summary: One note, its properties and its body as safe HTML
      parameters:
        - {name: path, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: The note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookNote'
        '400': {description: A path that is not allowed}
        '404': {description: No such note}
        '503': {description: No notebook is connected}
  /api/v1/notebook/search:
    get:
      operationId: searchNotebook
      summary: Notes whose title, tags, description or path match every word of q
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: The matches, best first, at most 40
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookSearch'
        '503': {description: No notebook is connected}
  /api/v1/systems/proxmox:
    get:
      operationId: getProxmox
      summary: The latest Proxmox snapshot the platform delivered, or why there is none
      responses:
        '200':
          description: The snapshot, or connected false with a reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxmoxState'
components:
  schemas:
    Status:
      enum: [not connected, parked, ok, unknown]
    Area:
      type: object
      additionalProperties: false
      required: [id, name, summary, owner, docs, exit_path, status]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        summary: {type: string, minLength: 1}
        owner: {type: string, minLength: 1}
        docs: {type: string, pattern: '^https://'}
        exit_path: {type: string, minLength: 1}
        status: {$ref: '#/components/schemas/Status'}
    Room:
      type: object
      additionalProperties: false
      required: [id, name, summary, owner, docs, exit_path, status, area, links]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        summary: {type: string, minLength: 1}
        owner: {type: string, minLength: 1}
        docs: {type: string, pattern: '^https://'}
        exit_path: {type: string, minLength: 1}
        status: {$ref: '#/components/schemas/Status'}
        area: {type: string, minLength: 1}
        links:
          type: array
          items: {type: string}
    Catalog:
      type: object
      additionalProperties: false
      required: [areas, rooms]
      properties:
        areas:
          type: array
          items: {$ref: '#/components/schemas/Area'}
        rooms:
          type: array
          items: {$ref: '#/components/schemas/Room'}
    Field:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label: {type: string, minLength: 1}
        value: {type: string, minLength: 1}
    Section:
      type: object
      additionalProperties: false
      required: [title, fields]
      properties:
        title: {type: string, minLength: 1}
        fields:
          type: array
          items: {$ref: '#/components/schemas/Field'}
    Agent:
      type: object
      additionalProperties: false
      required: [id, name, purpose, revision, notes, sections]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        purpose: {type: string, minLength: 1}
        revision: {type: string, minLength: 1}
        notes: {type: string}
        sections:
          type: array
          minItems: 10
          maxItems: 10
          items: {$ref: '#/components/schemas/Section'}
    Agents:
      type: object
      additionalProperties: false
      required: [agents]
      properties:
        agents:
          type: array
          items: {$ref: '#/components/schemas/Agent'}
    NoteMeta:
      type: object
      additionalProperties: false
      required: [path, title, description, tags]
      properties:
        path: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        description: {type: string}
        tags:
          type: array
          items: {type: string}
    NotebookState:
      oneOf:
        - type: object
          additionalProperties: false
          required: [connected, notes]
          properties:
            connected: {const: true}
            notes: {type: integer, minimum: 0}
        - type: object
          additionalProperties: false
          required: [connected, reason]
          properties:
            connected: {const: false}
            reason: {type: string, minLength: 1}
    NotebookFolder:
      type: object
      additionalProperties: false
      required: [path, folders, notes, index]
      properties:
        path: {type: string}
        folders:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, path]
            properties:
              name: {type: string, minLength: 1}
              path: {type: string, minLength: 1}
        notes:
          type: array
          items: {$ref: '#/components/schemas/NoteMeta'}
        index: {type: [string, 'null']}
    NotebookNote:
      type: object
      additionalProperties: false
      required: [path, title, description, properties, html, up]
      properties:
        path: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        description: {type: string}
        properties:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, value]
            properties:
              key: {type: string, minLength: 1}
              value: {type: string}
        html: {type: string}
        up: {type: string}
    NotebookSearch:
      type: object
      additionalProperties: false
      required: [notes]
      properties:
        notes:
          type: array
          items: {$ref: '#/components/schemas/NoteMeta'}
    ProxmoxResource:
      type: object
      additionalProperties: false
      required: [type, id, name, node, status, cpu, maxcpu, mem, maxmem, disk, maxdisk, uptime]
      properties:
        type: {enum: [node, qemu, lxc, storage]}
        id: {type: string}
        name: {type: string}
        node: {type: string}
        status: {type: string}
        cpu: {type: [number, 'null']}
        maxcpu: {type: [number, 'null']}
        mem: {type: [number, 'null']}
        maxmem: {type: [number, 'null']}
        disk: {type: [number, 'null']}
        maxdisk: {type: [number, 'null']}
        uptime: {type: [number, 'null']}
    ProxmoxState:
      oneOf:
        - type: object
          additionalProperties: false
          required: [connected, snapshot]
          properties:
            connected: {const: true}
            snapshot:
              type: object
              additionalProperties: false
              required: [generatedAt, ageSeconds, stale, resources]
              properties:
                generatedAt: {type: string}
                ageSeconds: {type: integer, minimum: 0}
                stale: {type: boolean}
                resources:
                  type: array
                  items: {$ref: '#/components/schemas/ProxmoxResource'}
        - type: object
          additionalProperties: false
          required: [connected, reason]
          properties:
            connected: {const: false}
            reason: {type: string, minLength: 1}
